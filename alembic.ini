# Sepsis Monitor AI - Enterprise Alembic Configuration
[alembic]
# FIXED: Realigned the migration script path with the actual project folder taxonomy
script_location = database/migrations
prepend_sys_path = .

# --- STANDARD ENTERPRISE LOGGING CONFIGURATION ---
[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
