# ============================================================
# Sepsis Monitor AI - MLOps & Security Continuous Integration
# ============================================================

name: Sepsis Monitor AI - MLOps & Security Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  audit-and-test:
    name: MLOps Quality, Testing & AI Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: latest

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Project Dependencies
        run: uv sync

      - name: Run Ruff Static Code Analysis
        run: uv run ruff check . --output-format=github

      - name: Run Pytest Test Suite
        run: uv run pytest -v

      - name: Set up Node.js for Promptfoo
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Run Promptfoo AI Security Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx promptfoo@latest eval -c promptfooConfig.yaml --no-cache