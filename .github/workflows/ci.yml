# ============================================================
# Sepsis Monitor AI - Continuous Integration Pipeline
# ============================================================

name: Sepsis Monitor AI CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Code Quality & Pytest Verification Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Project Dependencies
        run: uv sync

      - name: Run Ruff Static Code Analysis
        run: uv run ruff check . --output-format=github

      - name: Run Pytest Test Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest -v

      - name: Set up Node.js for Promptfoo
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install Promptfoo CLI
        run: npm install -g promptfoo

      - name: Execute Promptfoo AI Security Evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: promptfoo eval -c promptfooConfig.yaml --no-cache

  docker-compilation:
    name: Docker Runtime Image Integrity Matrix
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nicu-sepsis-monitor-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
