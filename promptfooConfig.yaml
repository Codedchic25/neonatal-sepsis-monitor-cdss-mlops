    assert:
      - type: contains
        value: "<RAPORT>"
      - type: contains
        value: "</RAPORT>"
      - type: contains
        value: "<MEDICATIE>"
      - type: contains
        value: "</MEDICATIE>"
      - type: contains
        value: "<FCC>"
      - type: contains
        value: "</FCC>"
      - type: contains-any
        value: ["Ampicillina", "Ampicillin"]
      - type: contains-any
        value: ["Gentamicina", "Gentamicin"]

  - description: "DE - high-risk sepsis"
    vars:
      lang: "German"
      vitals: "Live-Patientendaten: Herzfrequenz 172 bpm, Körpertemperatur 39.0 °C, Sauerstoffsättigung 91%, CRP 22.0 mg/L, PCT 4.0 ng/mL, Kangaroo Care inaktiv, Ernährung eigene Muttermilch, Nierenstatus normal."
    assert:
      - type: contains
        value: "<RAPORT>"
